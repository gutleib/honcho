# Honcho — Russian self-hosted fork
# 1-3 пользователя, локальная сеть
#
# Деплой:
#   1. Скопировать .env.selfhosted.template → .env, заполнить ключи
#   2. docker compose -f docker-compose.selfhosted.yml up -d --build
#
# Порты:
#   - 8000: API (только localhost — для внешнего доступа используй reverse proxy)
#   - 5432, 6379, 7997: только localhost
#
# Системные требования: минимум 10 GB RAM, рекомендуется 12+ GB.
# BAAI/bge-m3 загружает ~6.6 GB, API пиково >512 MB.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      - CACHE_URL=redis://:${REDIS_PASSWORD}@redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    mem_limit: 1G
    # Пиково >512 MB при запуске из-за загрузки токенизаторов и моделей

  embedding:
    image: michaelf34/infinity:0.0.77-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:7997:7997"
    command:
      - "v2"
      - "--model-id"
      - "deepvk/USER-bge-m3"
      - "--engine"
      - "torch"
      - "--port"
      - "7997"
    volumes:
      - embedding-cache:/app/.cache/huggingface
    mem_limit: 8G
    # deepvk/USER-bge-m3 — специально обучена для русского языка.
    # Русский MTEB: 0.706 (против 0.689 у BAAI/bge-m3).
    # Размерность 1024, совместима с Honcho из коробки.
    # Загружает ~6.6 GB в RAM при первом запуске.

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256M
    # При реальной эксплуатации: стабильно 64 MB, пиково до 150 MB.
    # Если нагрузка выше — поднять до 512M.

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 900 1 --save 300 10
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128M

volumes:
  pgdata:
  redis-data:
  embedding-cache:
